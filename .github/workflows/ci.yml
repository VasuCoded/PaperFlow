name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Tenancy lint (static policy scan)
        run: npm run tenancy-lint

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: DB lint
        run: supabase db lint

      - name: Apply migrations from empty
        run: supabase db reset

      - name: Set DB URL
        run: echo "SUPABASE_DB_URL=postgresql://postgres:postgres@localhost:54322/postgres" >> "$GITHUB_ENV"

      - name: RLS tests
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls.test.sql

      - name: Tenancy tests
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/tenancy.test.sql

      - name: Cross-tenant isolation suite
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/isolation.test.sql
