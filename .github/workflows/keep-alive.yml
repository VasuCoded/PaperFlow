name: Keep-alive

# BUILD-PLAN C12 item 3. A daily trivial query so the Supabase free tier does
# not pause after 7 days of inactivity. Term breaks are exactly when this matters.

on:
  schedule:
    - cron: "0 6 * * *" # 11:30 IST daily
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Trivial query
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: psql "$SUPABASE_PROD_DB_URL" -v ON_ERROR_STOP=1 -c "select 1 as keepalive, now();"
