name: Keep-alive

# BUILD-PLAN C12 item 3. A daily trivial query so the Supabase free tier does
# not pause after 7 days of inactivity. Term breaks are exactly when this matters.
# A paused project makes the first visit afterwards take many seconds (or fail).
#
# Pings the database the live site uses: set the repository secret
# SUPABASE_DB_URL to its session pooler connection string (Settings > Secrets
# and variables > Actions). SUPABASE_PROD_DB_URL still works, for when a
# separate production database exists.

on:
  schedule:
    - cron: "0 6 * * *" # 11:30 IST daily
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Trivial query
        env:
          DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL || secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::No database secret is set (SUPABASE_DB_URL or SUPABASE_PROD_DB_URL), so nothing is being kept awake."
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select 1 as keepalive, now();"
